name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y emacs-nox tmux ripgrep fd-find jq colordiff curl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install emacs tmux ripgrep fd jq

      - name: Run Dotfiles Test Harness (Tiers 1-4)
        run: ./test/test_dotfiles.sh

      - name: Run Adversarial Stress Suite (Tier 5)
        run: ./test/tier5_adversarial.sh
